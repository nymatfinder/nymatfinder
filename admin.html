<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYmatfinder | Admin Dashboard</title>
</head>
<body>

  <h1>NYmatfinder Admin Dashboard</h1>
<form id="admin-login">
  <h2>Administrator Login</h2>
  <label for="admin-email">Email</label>
    <input
      type="email"
      id="admin-email"
      autocomplete="username"
      required
    >

    <label for="admin-password">Password</label>
    <input
      type="password"
      id="admin-password"
      autocomplete="current-password"
      required
    >

    <button type="submit">Log In</button>
  </form>

  <p id="login-message" role="status"></p>
  <section id="admin-dashboard" hidden>
  <h2>Pending Tournament Submissions</h2>

  <p id="submissions-message">Loading submissions...</p>

  <div id="pending-submissions"></div>
</section>
<script>
  const SUPABASE_URL = "https://phfijrkrcoanxwzdstjk.supabase.co";
  const SUPABASE_KEY = "sb_publishable_uvoUWKajiVZ_H7Kkte16Gw_1GDnOIO_";
async function loadPendingSubmissions(accessToken) {
  const container = document.getElementById("pending-submissions");
  const message = document.getElementById("submissions-message");

  message.textContent = "Loading submissions...";

  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/tournament_submissions?select=*&submission_status=eq.pending`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${accessToken}`
        }
      }
    );

    if (!response.ok) {
      throw new Error("Unable to load submissions (" + response.status + ").");
    }

    const submissions = await response.json();

    const escapeHTML = value =>
      String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));

    if (!submissions.length) {
      container.innerHTML = "";
      message.textContent = "There are no pending tournament submissions.";
      return;
    }

    container.innerHTML = submissions.map(t => `
      <article style="border:1px solid #ddd;border-radius:8px;padding:16px;margin:16px 0;">
        <h3>${escapeHTML(t.tournament_name)}</h3>
        <p>
          <strong>Date:</strong> ${escapeHTML(t.tournament_date || "TBD")}<br>
          <strong>Location:</strong> ${escapeHTML(t.city)}, ${escapeHTML(t.state)}<br>
          <strong>Contact:</strong> ${escapeHTML(t.contact_email)}<br>
          <strong>Package:</strong> ${escapeHTML(t.listing_package)}<br>
          <strong>Style:</strong> ${escapeHTML(t.wrestling_style || "Not specified")}<br>
          <strong>Details:</strong> ${escapeHTML(t.additional_details || "None provided")}
        </p>
        <p><strong>Status:</strong> Pending review</p>
      </article>
    `).join("");

    message.textContent = `${submissions.length} pending submission(s).`;

  } catch (error) {
    console.error("Loading submissions failed:", error);
    message.textContent = error.message;
  }
}  
const loginForm = document.getElementById("admin-login");
const loginMessage = document.getElementById("login-message");

loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = document.getElementById("admin-email").value;
  const password = document.getElementById("admin-password").value;

  loginMessage.textContent = "Signing in...";

  try {
    const response = await fetch(
      `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY
        },
        body: JSON.stringify({ email, password })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.msg || data.error_description || "Login failed.");
    }

    sessionStorage.setItem("nymatfinder_access_token", data.access_token);

    const adminResponse = await fetch(
  `${SUPABASE_URL}/rest/v1/rpc/is_nymatfinder_admin`,
  {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${data.access_token}`,
      "Content-Type": "application/json"
    },
    body: "{}"
  }
);

if (!adminResponse.ok) {
  sessionStorage.removeItem("nymatfinder_access_token");
  throw new Error("Unable to verify administrator access.");
}

const isAdmin = await adminResponse.json();

if (isAdmin !== true) {
  sessionStorage.removeItem("nymatfinder_access_token");
  throw new Error("Access denied. This account is not an administrator.");
}

loginMessage.textContent = "Administrator access verified!";
    document.getElementById("admin-dashboard").hidden = false;
    await loadPendingSubmissions(data.access_token);
    loginForm.reset();

  } catch (error) {
    loginMessage.textContent = error.message;
  }
});  
</script>
</body>
</html>
